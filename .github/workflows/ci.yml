name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node cli/unitern.mjs build templates/platformer --out dist-demo
      - run: node cli/unitern.mjs build templates/starter --out dist-starter
      - run: node cli/unitern.mjs doctor
